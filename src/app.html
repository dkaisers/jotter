<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="jotter — a quiet, local-first space for notes and todos." />
		<meta name="theme-color" content="#1f1d1a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="jotter" />
		<meta property="og:title" content="jotter" />
		<meta property="og:description" content="A quiet, local-first space for notes and todos." />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="jotter" />
		<meta name="twitter:description" content="A quiet, local-first space for notes and todos." />
		<title>jotter</title>
		<script>
			(() => {
				var key = 'jotter:theme';
				var modes = ['light', 'dark'];
				var fonts = ['sans', 'serif', 'mono'];
				var s = { mode: 'dark', uiFont: 'sans', contentFont: 'serif', grain: true };
				try {
					var stored = window.localStorage.getItem(key);
					if (stored) {
						var parsed = JSON.parse(stored);
						if (modes.includes(parsed.mode)) s.mode = parsed.mode;
						if (fonts.includes(parsed.uiFont)) s.uiFont = parsed.uiFont;
						if (fonts.includes(parsed.contentFont)) s.contentFont = parsed.contentFont;
						if (typeof parsed.grain === 'boolean') s.grain = parsed.grain;
					}
				} catch (e) {}
				document.documentElement.setAttribute('data-theme', s.mode);
				document.documentElement.setAttribute('data-ui-font', s.uiFont);
				document.documentElement.setAttribute('data-content-font', s.contentFont);
				document.documentElement.setAttribute('data-grain', s.grain ? '1' : '0');
				var palettes = {
					dark: { base: '#1f1d1a', primary: '#d0765a' },
					light: { base: '#f5f1e8', primary: '#c05b3c' }
				};
				var p = palettes[s.mode];
				var svg =
					"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>" +
					"<rect x='1' y='1' width='22' height='22' rx='6' fill='" +
					p.base +
					"'/>" +
					"<g transform='translate(12.5 11.5) scale(0.8) translate(-12.5 -11.5)' fill='none' stroke='" +
					p.primary +
					"' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'>" +
					"<path d='M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z'/>" +
					"<path d='m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18'/>" +
					"<path d='m2.3 2.3 7.286 7.286'/>" +
					"<circle cx='11' cy='11' r='2'/></g></svg>";
				var link = document.querySelector('link[rel="icon"]');
				if (!link) {
					link = document.createElement('link');
					link.rel = 'icon';
					link.type = 'image/svg+xml';
					document.head.appendChild(link);
				}
				link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
				var themeColor = document.querySelector('meta[name="theme-color"]');
				if (themeColor) themeColor.setAttribute('content', p.bg);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
